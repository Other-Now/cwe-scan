name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build llvm-20-dev libclang-20-dev libclang-cpp20-dev clang-tidy-20 cppcheck
      - name: build
        run: cmake -S . -B build -G Ninja && cmake --build build
      - name: unit cases
        run: python3 tests/run_tests.py
      - name: fetch Juliet C/C++ 1.3
        run: |
          curl -sSL -o juliet.zip https://samate.nist.gov/SARD/downloads/test-suites/2017-10-01-juliet-test-suite-for-c-cplusplus-v1-3.zip
          unzip -q juliet.zip -d juliet
      - name: Juliet scores match results/juliet.json
        run: |
          python3 bench/juliet.py --juliet juliet/C --tools cwe-scan,cwe-scan-whole --out ci-results
          python3 bench/check_results.py results/juliet.json ci-results/juliet.json cwe-scan cwe-scan-whole cwe-scan-definite cwe-scan-whole-definite
